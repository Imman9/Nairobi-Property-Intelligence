version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: npi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "417223"
      POSTGRES_DB: npi
    ports:
      - "5432:5433"
    volumes:
      - npi_pg_data:/var/lib/postgresql/data

volumes:
  npi_pg_data:
